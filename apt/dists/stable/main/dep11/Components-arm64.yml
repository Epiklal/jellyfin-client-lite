ProjectLicense: Apache-2.0
Name:
  C: "Jellyfin Client Lite"
Summary:
  C: "Tiny terminal music player for your Jellyfin library"
  de: "Kleiner Terminal-Musikplayer für deine Jellyfin-Bibliothek"
Description:
  C: "<p>Start it and it shuffles your whole Jellyfin music library in the terminal. Playback is done by mpv and the files are streamed as they are, without transcoding, so it stays light on your PC and your server.</p><ul><li>Media keys and the desktop media widget work (with mpv-mpris)</li><li>Search, album view, cover art and lyrics from your server</li><li>Tells your server what is playing, so play counts and statistics stay up to date</li><li>Optionally shows what you are listening to in Discord</li></ul>"
  de: "<p>Starten, und es spielt deine ganze Jellyfin-Musikbibliothek zufällig im Terminal ab. Die Wiedergabe übernimmt mpv, die Dateien kommen unverändert ohne Umwandeln, das schont PC und Server.</p><ul><li>Medientasten und das Medien-Widget des Desktops funktionieren (mit mpv-mpris)</li><li>Suche, Album-Ansicht, Cover und Songtexte vom Server</li><li>Meldet dem Server, was läuft – Wiedergabezahlen und Statistik bleiben aktuell</li><li>Zeigt auf Wunsch in Discord an, was du hörst</li></ul>"
