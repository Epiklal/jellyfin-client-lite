name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          # Älteste unterstützte Textual-Version (Debian 13 liefert sie aus)
          - os: ubuntu-latest
            python: "3.13"
            textual: "2.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.textual
        run: python -m pip install "textual==${{ matrix.textual }}"
      - run: python -m pytest -q
