name: Release

# Neue Version veröffentlichen: Version in jfclite/__init__.py und im
# metainfo.xml eintragen, committen, dann  git tag v0.3.3 && git push --tags
# Danach baut diese Action das .deb, legt das GitHub-Release an und
# aktualisiert die APT-Paketquelle auf GitHub Pages - wer das Paket hat,
# bekommt das Update mit den normalen System-Updates.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag passt zur Version
        run: |
          version=$(python3 -c 'import jfclite; print(jfclite.__version__)')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME passt nicht zu __version__ $version"; exit 1; }

      - name: Tests
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q

      - name: Werkzeuge
        run: sudo apt-get install -y -q apt-utils librsvg2-bin

      - name: .deb bauen
        run: ./build-deb.sh

      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ### Install (Debian, Ubuntu, Linux Mint)

          Download the `.deb` below and open it, your software center installs it. Or in a terminal:

          ```sh
          wget -O /tmp/jellyfin-client-lite.deb https://epiklal.github.io/jellyfin-client-lite/jellyfin-client-lite.deb
          sudo apt install /tmp/jellyfin-client-lite.deb
          ```

          From 0.3.3 on, the package brings its own APT source: later updates arrive with your normal system updates (Discover, `apt upgrade`, ...).

          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes

      - name: APT-Paketquelle aktualisieren
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          ./packaging/publish-apt.sh dist/*.deb
